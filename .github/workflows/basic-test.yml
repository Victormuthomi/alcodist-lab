name: Basic Functionality Check

on:
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  basic-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Install server dependencies with legacy-peer-deps
      - name: Install server dependencies
        working-directory: ./server
        run: npm install --legacy-peer-deps

      # Start server in background
      - name: Start server
        working-directory: ./server
        run: npm run start &

      - name: Wait for server to start
        run: sleep 10

      # Install test dependencies with legacy-peer-deps
      - name: Install test dependencies
        working-directory: ./test
        run: npm install --legacy-peer-deps

      # Ensure TypeScript is installed for ts-jest
      - name: Install TypeScript for tests
        working-directory: ./test
        run: npm install typescript --save-dev

      # Set up database (keep existing command, untouched)
      - name: Set up database and seed data
        working-directory: ./server
        run: export PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING=1 && npx prisma migrate dev --name init

      # Run basic functionality tests
      - name: Run basic functionality tests
        working-directory: ./test
        run: npx jest --config ./jest-basic.json
